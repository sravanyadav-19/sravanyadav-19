<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-label="Top languages">
<defs><style><![CDATA[
text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 4s ease-in-out 2.2s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#ff5fa8;#c77dff;#ff5fa8" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#c77dff;#ff5fa8;#c77dff" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="cardc"><rect x="1" y="1" width="418" height="280" rx="14"/></clipPath>
<clipPath id="stackc"><rect x="20" y="58" width="0" height="11" rx="5.5"><animate attributeName="width" from="0" to="380" dur="1.4s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath>
</defs>
<rect x="1" y="1" width="418" height="280" rx="14" fill="#1b1030" stroke="url(#tg)" stroke-width="1.5"/>
<text x="20" y="34" font-size="16" font-weight="bold" fill="url(#tg)">📊 Top Languages</text>
<g clip-path="url(#stackc)"><rect x="20.0" y="58" width="129.2" height="11" fill="#7db8ff"/><rect x="149.2" y="58" width="83.6" height="11" fill="#fde047"/><rect x="232.8" y="58" width="60.8" height="11" fill="#ff7a59"/><rect x="293.6" y="58" width="53.2" height="11" fill="#c77dff"/><rect x="346.8" y="58" width="53.2" height="11" fill="#5fe3c0"/></g>

  <g class="row" style="animation-delay:0.90s">
    <circle cx="26" cy="77" r="5" fill="#7db8ff"/>
    <text x="40" y="82" font-size="13" fill="#efe9fb" font-weight="bold">Python</text>
    <text x="396" y="82" text-anchor="end" font-size="13" fill="#7db8ff" font-weight="bold">34.0%</text>
    <rect x="40" y="90" width="268" height="9" rx="4.5" fill="#251343"/>
    <rect class="bar" x="40" y="90" width="91.1" height="9" rx="4.5" fill="#7db8ff" style="animation-delay:1.05s">
      <animate attributeName="width" from="0" to="91.1" dur="1.1s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.12s">
    <circle cx="26" cy="119" r="5" fill="#fde047"/>
    <text x="40" y="124" font-size="13" fill="#efe9fb" font-weight="bold">JavaScript</text>
    <text x="396" y="124" text-anchor="end" font-size="13" fill="#fde047" font-weight="bold">22.0%</text>
    <rect x="40" y="132" width="268" height="9" rx="4.5" fill="#251343"/>
    <rect class="bar" x="40" y="132" width="59.0" height="9" rx="4.5" fill="#fde047" style="animation-delay:1.27s">
      <animate attributeName="width" from="0" to="59.0" dur="1.1s" begin="1.27s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.34s">
    <circle cx="26" cy="161" r="5" fill="#ff7a59"/>
    <text x="40" y="166" font-size="13" fill="#efe9fb" font-weight="bold">Java</text>
    <text x="396" y="166" text-anchor="end" font-size="13" fill="#ff7a59" font-weight="bold">16.0%</text>
    <rect x="40" y="174" width="268" height="9" rx="4.5" fill="#251343"/>
    <rect class="bar" x="40" y="174" width="42.9" height="9" rx="4.5" fill="#ff7a59" style="animation-delay:1.49s">
      <animate attributeName="width" from="0" to="42.9" dur="1.1s" begin="1.49s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.56s">
    <circle cx="26" cy="203" r="5" fill="#c77dff"/>
    <text x="40" y="208" font-size="13" fill="#efe9fb" font-weight="bold">R</text>
    <text x="396" y="208" text-anchor="end" font-size="13" fill="#c77dff" font-weight="bold">14.0%</text>
    <rect x="40" y="216" width="268" height="9" rx="4.5" fill="#251343"/>
    <rect class="bar" x="40" y="216" width="37.5" height="9" rx="4.5" fill="#c77dff" style="animation-delay:1.71s">
      <animate attributeName="width" from="0" to="37.5" dur="1.1s" begin="1.71s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>
  <g class="row" style="animation-delay:1.78s">
    <circle cx="26" cy="245" r="5" fill="#5fe3c0"/>
    <text x="40" y="250" font-size="13" fill="#efe9fb" font-weight="bold">C++</text>
    <text x="396" y="250" text-anchor="end" font-size="13" fill="#5fe3c0" font-weight="bold">14.0%</text>
    <rect x="40" y="258" width="268" height="9" rx="4.5" fill="#251343"/>
    <rect class="bar" x="40" y="258" width="37.5" height="9" rx="4.5" fill="#5fe3c0" style="animation-delay:1.93s">
      <animate attributeName="width" from="0" to="37.5" dur="1.1s" begin="1.93s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

<g clip-path="url(#cardc)"><rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)" transform="skewX(-15)"/></g>
</svg>