<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 470" width="420" height="470" role="img">
<title>Profile stats</title>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#170e28"/><stop offset="1" stop-color="#221240"/>
</linearGradient>
<linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0" stop-color="#ff6ec7"/><stop offset="1" stop-color="#7b5cff"/>
</linearGradient>
<style><![CDATA[
.ringF{stroke-dasharray:452.4;stroke-dashoffset:452.4;animation:ring 1.9s .4s cubic-bezier(.3,.8,.3,1) forwards;}
@keyframes ring{to{stroke-dashoffset:58.8}}
.row{opacity:0;animation:sl .7s ease-out both;}
@keyframes sl{from{opacity:0;transform:translateX(-46px)}to{opacity:1;transform:translateX(0)}}
]]></style>
</defs>
<rect width="420" height="470" rx="20" fill="url(#bg)" stroke="rgba(255,255,255,0.09)"/>
<text x="210" y="42" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#a294c4">PROFILE STATS</text>
<circle cx="210" cy="152" r="72" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="13"/>
<circle class="ringF" cx="210" cy="152" r="72" fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round" transform="rotate(-90 210 152)"/>
<text x="210" y="160" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="31" font-weight="800" fill="#efe9fb">87%</text>
<text x="210" y="184" text-anchor="middle" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" letter-spacing="2" fill="#a294c4">AI/ML RANK</text>
<g class="row" style="animation-delay:0.30s"><rect x="36" y="246" width="348" height="38" rx="12" fill="rgba(255,255,255,0.045)"/><text x="56" y="269" font-size="15">🚀</text><text x="84" y="272" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cfc4e8">Projects Shipped</text><text x="366" y="273" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff77b5">4</text></g>
<g class="row" style="animation-delay:0.46s"><rect x="36" y="292" width="348" height="38" rx="12" fill="rgba(255,255,255,0.045)"/><text x="56" y="315" font-size="15">🧩</text><text x="84" y="318" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cfc4e8">Repos</text><text x="366" y="319" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff77b5">10+</text></g>
<g class="row" style="animation-delay:0.62s"><rect x="36" y="338" width="348" height="38" rx="12" fill="rgba(255,255,255,0.045)"/><text x="56" y="361" font-size="15">🎓</text><text x="84" y="364" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cfc4e8">Students Addressed</text><text x="366" y="365" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff77b5">150+</text></g>
<g class="row" style="animation-delay:0.78s"><rect x="36" y="384" width="348" height="38" rx="12" fill="rgba(255,255,255,0.045)"/><text x="56" y="407" font-size="15">🔥</text><text x="84" y="410" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="14.5" fill="#cfc4e8">Experience</text><text x="366" y="411" text-anchor="end" font-family="'Segoe UI',system-ui,-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif" font-size="17" font-weight="700" fill="#ff77b5">3 yrs</text></g>
</svg>